<!DOCTYPE html>
<html>
<head>
<style>
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f0f0; display: flex; justify-content: center; padding: 20px; }
  .canvas { background: white; padding: 30px; border-radius: 5px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); position: relative; width: 1000px; }
  h2 { color: #333; border-bottom: 2px solid #333; padding-bottom: 10px; }
  .block-label { font-weight: bold; font-size: 14px; fill: #444; }
  .comp-label { font-size: 11px; fill: #666; }
  line, polyline, rect, circle { stroke: black; stroke-width: 2; fill: none; }
  .power { stroke: #d32f2f; stroke-width: 2.5; } /* Rød for +5V Bus */
  .gnd { stroke: #1976d2; stroke-width: 2.5; }   /* Blå for Stel/GND */
  text { font-family: monospace; font-size: 12px; }
  .box { fill: #fff; stroke: black; stroke-width: 2; }
</style>
</head>
<body>

<div class="canvas">
  <h2>HYBRID GEIGERTÆLLER - MASTER SCHEMATIC</h2>
  <svg width="950" height="600" viewBox="0 0 950 600">
    
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="black" />
      </marker>
      <g id="gnd-sym">
        <line x1="-10" y1="0" x2="10" y2="0" />
        <line x1="-6" y1="4" x2="6" y2="4" />
        <line x1="-2" y1="8" x2="2" y2="8" />
      </g>
    </defs>

    <text x="20" y="30" font-weight="bold">BLOK 4: STRØMFORSYNING (9V -> 5V)</text>
    <rect x="20" y="40" width="60" height="40" class="box" />
    <text x="25" y="65">9V BAT</text>
    <line x1="80" y1="60" x2="130" y2="60" /> <rect x="130" y="40" width="80" height="50" class="box" />
    <text x="135" y="60">LM7805</text>
    <text x="135" y="80" class="comp-label">Regulator</text>
    
    <use href="#gnd-sym" x="170" y="100" />
    <line x1="170" y1="90" x2="170" y2="100" />

    <polyline points="210,60 900,60" class="power" />
    <text x="850" y="55" fill="#d32f2f" font-weight="bold">+5V BUS</text>

    <text x="20" y="180" font-weight="bold">BLOK 1: SENSOR</text>
    <rect x="20" y="190" width="140" height="100" class="box" style="fill:#f8cecc" />
    <text x="30" y="220">DFROBOT</text>
    <text x="30" y="240">SEN0463</text>
    
    <line x1="100" y1="60" x2="100" y2="190" class="power" marker-end="url(#arrow)" />
    <use href="#gnd-sym" x="100" y="310" />
    <line x1="100" y1="290" x2="100" y2="310" />

    <line x1="160" y1="240" x2="200" y2="240" />
    <circle cx="200" cy="240" r="3" style="fill:black" />
    <text x="170" y="235">5V PULS</text>

    <text x="650" y="130" font-weight="bold">BLOK 3: DIGITAL</text>
    <rect x="650" y="140" width="200" height="150" class="box" style="fill:#d5e8d4" />
    <text x="660" y="170">ARDUINO NANO</text>
    
    <polyline points="200,240 200,160 650,160" marker-end="url(#arrow)" />
    <text x="610" y="155">D2</text>

    <rect x="700" y="220" width="80" height="40" class="box" />
    <text x="715" y="245">OLED</text>
    <text x="715" y="210" class="comp-label">I2C (A4/A5)</text>

    <text x="250" y="330" font-weight="bold">BLOK 2: ANALOGT RATEMETER</text>
    
    <rect x="250" y="350" width="120" height="100" class="box" style="fill:#fff2cc" />
    <text x="280" y="380">ICM7555</text>
    <text x="260" y="400" class="comp-label">PULSE SHAPER</text>
    <line x1="200" y1="240" x2="200" y2="400" />
    <line x1="200" y1="400" x2="250" y2="400" marker-end="url(#arrow)" />
    <text x="220" y="395">Pin 2</text>

    <line x1="370" y1="400" x2="420" y2="400" marker-end="url(#arrow)" />
    <text x="375" y="395">Out</text>
    
    <rect x="420" y="390" width="30" height="15" /> <text x="420" y="385" class="comp-label">R: 100k</text>
    
    <line x1="450" y1="400" x2="500" y2="400" />
    <circle cx="500" cy="400" r="3" style="fill:black" />
    
    <line x1="500" y1="400" x2="500" y2="440" />
    <rect x="490" y="440" width="20" height="10" style="fill:black" /> <line x1="490" y1="455" x2="510" y2="455" />
    <use href="#gnd-sym" x="500" y="480" />
    <line x1="500" y1="455" x2="500" y2="480" />
    <text x="515" y="450" class="comp-label">10uF TANTAL</text>

    <polyline points="500,400 550,400 550,410" />
    <path d="M530,410 L570,410 L550,440 Z" class="box" /> <text x="545" y="430">LM358</text>
    
    <line x1="550" y1="440" x2="550" y2="480" />
    <line x1="550" y1="480" x2="600" y2="480" marker-end="url(#arrow)" />
    
    <circle cx="620" cy="480" r="15" /> <line x1="610" y1="470" x2="610" y2="490" /> <line x1="610" y1="475" x2="630" y2="465" /> <line x1="610" y1="485" x2="630" y2="495" /> <text x="635" y="485">2N2222</text>

    <line x1="630" y1="495" x2="630" y2="530" />
    <rect x="620" y="530" width="30" height="15" /> <line x1="620" y1="545" x2="650" y2="530" /> <text x="655" y="540">50k TRIM</text>

    <rect x="750" y="480" width="80" height="60" class="box" />
    <path d="M760,530 Q790,490 820,530" /> <line x1="790" y1="530" x2="810" y2="500" /> <text x="765" y="520">100uA</text>
    <line x1="650" y1="538" x2="750" y2="538" marker-end="url(#arrow)" />
    <use href="#gnd-sym" x="830" y="538" />

  </svg>
</div>

</body>
</html>
